[project]
name = "audio-debrief"
version = "0.1.0"
description = "Local audio analysis for interview debriefs: diarized transcript + delivery metrics"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "faster-whisper>=1.1",
    "pyannote.audio>=3.3,<4",
    "librosa>=0.10",
    "soundfile>=0.12",
    "numpy>=1.26",
    "rapidfuzz>=3.0",
    "pyyaml>=6.0",
    "huggingface_hub[cli]>=0.25,<1.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["audio_debrief"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
